[workspace]
resolver = "2"
members = [
    "apps/*",
    "binaries/cli",
    "crates/*",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
repository = "https://github.com/opendownloadmanager/opendownloadmanager"
description = "OpenDownloadManager: a free and open-source desktop download manager."

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate"] }
url = { version = "2.5", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1.0"
anyhow = "1.0"
bytes = "1.7"
futures-util = "0.3"
uuid = { version = "1.10", features = ["v4"] }
indicatif = "0.17"
humantime = "2.1"
http = "1.1"
async-trait = "0.1"
wiremock = "0.6"
tempfile = "3.13"
hyper = "1.4"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tower = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
