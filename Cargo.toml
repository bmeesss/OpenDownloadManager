[workspace]
resolver = "2"
members = [
    "apps",
    "binaries/cli",
    "crates/*",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bmeesss/OpenDownloadManager"
description = "OpenDownloadManager: a free and open-source desktop download manager."

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
# Built without the `gzip`/`brotli`/`deflate` features on purpose: responses are
# never transparently decoded, so the bytes on disk are exactly the bytes the
# server sent and `Content-Length` always describes the file.
#
# `rustls-tls` supplies the bundled (webpki) root certificates and
# `rustls-tls-native-roots` supplies the operating system's root certificates;
# `HttpClient::new` turns both on via `tls_built_in_root_certs(true)`.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "rustls-tls-native-roots",
    "http2",
    "stream",
] }
url = { version = "2.5", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1.0"
anyhow = "1.0"
bytes = "1.7"
futures-util = "0.3"
async-stream = "0.3"
uuid = { version = "1.10", features = ["v4"] }
indicatif = "0.17"
wiremock = "0.6"
tempfile = "3.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
