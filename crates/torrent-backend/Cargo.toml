[package]
name = "odm-torrent-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BitTorrent backend for OpenDownloadManager."

[dependencies]
odm-core = { path = "../core" }
odm-storage = { path = "../storage" }
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
hex = { version = "0.4" }

[dev-dependencies]
odm-download-manager = { path = "../download-manager" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
